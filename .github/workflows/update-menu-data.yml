name: Update menu data

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:       # manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch menu data from Google Sheets
        run: node scripts/fetch-menu-data.js

      # always(): a problem in one sheet must not block updates from the other
      - name: Fetch reservation dates from Google Sheets
        if: always()
        run: node scripts/fetch-reservation-dates.js

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/menu-data.js js/reservation-dates.js
          git diff --cached --quiet || git commit -m "chore: update site data from Google Sheets"
          git push
